services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kairos-postgres
    environment:
      POSTGRES_DB: kairos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - kairos_pg_data:/var/lib/postgresql/data
     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kairos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kairos_pg_data:
