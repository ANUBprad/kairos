services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kairos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # The Portal test suite runs one file per core and each file's Prisma client
    # sizes its own pool at (cores * 2 + 1). At the default 100 connections a
    # full local run oversubscribes the database and short interactive
    # transactions expire on Prisma's 5s timeout, which looks like a random
    # product failure. Raise the ceiling instead of lengthening any timeout.
    # Kept below the 1G container limit: Postgres allocates per-connection
    # structures up front, so this plus shared_buffers has to fit.
    command: postgres -c max_connections=300
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1G"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kairos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kairos

  chromadb:
    image: chromadb/chroma:1.0.15
    ports:
      - "7777:8000"
    volumes:
      - chroma_data:/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "2G"
    restart: unless-stopped
    healthcheck:
      # Chroma 1.x ships a static binary with no python3 on PATH, so probe the
      # listening port with bash's /dev/tcp instead of a python one-liner.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - kairos

  intelligence:
    build:
      context: .
      dockerfile: docker/intelligence.Dockerfile
    ports:
      - "127.0.0.1:${INTELLIGENCE_PORT:-28080}:28080"
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      - CHROMA_STORE_HOST=chromadb
      - CHROMA_STORE_PORT=8000
      # The gateway reaches this port over the private compose network, so the
      # bind host is widened from the loopback default. The published port stays
      # on the host loopback so the plaintext channel is not reachable from the
      # LAN; production runs with TLS or a loopback bind instead.
      - KAIROS_GRPC_BIND_HOST=0.0.0.0
      - KAIROS_PROVIDER_TIMEOUT_SECONDS=${KAIROS_PROVIDER_TIMEOUT_SECONDS:-90}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',28080)); s.close()"]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 120s
    depends_on:
      chromadb:
        condition: service_healthy
    networks:
      - kairos

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - INTELLIGENCE_HOST=intelligence
      - INTELLIGENCE_PORT=28080
      - KAIROS_PROVIDER_TIMEOUT_SECONDS=${KAIROS_PROVIDER_TIMEOUT_SECONDS:-90}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      intelligence:
        condition: service_healthy
    networks:
      - kairos

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - gateway
    networks:
      - kairos

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - prometheus
    networks:
      - kairos

  # Applies pending Prisma migrations once per `docker compose up`, before the
  # portal and worker start. Uses the builder stage because the standalone
  # runtime image intentionally has no Prisma CLI or migration files.
  migrate:
    build:
      context: .
      dockerfile: docker/portal.Dockerfile
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=${PORTAL_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/kairos?schema=public}
      - DIRECT_URL=${PORTAL_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/kairos?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - kairos

  # Production build of the Next.js portal. NODE_ENV=production means demo mode
  # is off (real sign-in) and object storage must be Cloudinary; set the
  # CLOUDINARY_* variables in .env. The published port stays on the host
  # loopback because TLS terminates outside this compose stack.
  portal:
    build:
      context: .
      dockerfile: docker/portal.Dockerfile
      target: portal
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:3000}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    ports:
      - "127.0.0.1:${PORTAL_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Override the host-facing URL in .env with the compose service name.
      - DATABASE_URL=${PORTAL_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/kairos?schema=public}
      - DIRECT_URL=${PORTAL_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/kairos?schema=public}
      - NEXT_PUBLIC_BETTER_AUTH_URL=${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:3000}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - kairos

  # Durable ingestion worker. Run at least one so queued documents finish even
  # when no browser request is alive; it is safe to kill and restart.
  worker:
    build:
      context: .
      dockerfile: docker/portal.Dockerfile
      target: worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=${PORTAL_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/kairos?schema=public}
      - DIRECT_URL=${PORTAL_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/kairos?schema=public}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - kairos

volumes:
  pg_data:
  chroma_data:
  prometheus_data:
  grafana_data:

networks:
  kairos:
    driver: bridge
    name: kairos-network
