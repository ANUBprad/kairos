# Render Blueprint — backend (OpenBook / ChaibookLM)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: openbook-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    # Liveness only — must not depend on DB/Pinecone, or a degraded
    # dependency fails the deploy. Use /health for dependency status.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (or as sync: false secrets):
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Required at runtime whenever Razorpay is enabled; without it every
      # genuine webhook fails HMAC verification and payments never settle.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Optional hardening: separates OAuth state HMAC from the auth secret.
      - key: OAUTH_STATE_SECRET
        sync: false
      # Optional canonical server URL used by auth/provider callbacks.
      - key: SERVER_URL
        sync: false
      # Optional explicit proxy tokens (numeric hop counts are rejected in
      # production). Set only when the service really runs behind a proxy.
      - key: TRUST_PROXY
        sync: false
