name: Portal CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    paths:
      - "apps/portal/**"

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          BETTER_AUTH_SECRET: "ci-placeholder-secret-for-build-only"

  portal-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairos_test
        ports:
          - 5432:5432
        # node --test runs one file per core, and each file's Prisma client
        # sizes its own pool at (cores * 2 + 1). On a 12-core runner that is
        # roughly 300 connections demanded against Postgres's default 100, so
        # short interactive transactions queue for a pooled connection and
        # abort on Prisma's 5s transaction timeout. Observed as an intermittent
        # "Transaction already closed" failure in embedding-hardening. Raising
        # the test database's connection ceiling fixes the oversubscription
        # instead of lengthening any timeout or serialising the suite.
        command: >
          postgres
          -c max_connections=400
          -c shared_buffers=256MB
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kairos_test
      KAIROS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kairos_test
      # Embeddings are pinned to 768, so the suites use the Gemini provider.
      # Suites that assert OpenAI chat behavior set AI_PROVIDER=openai
      # themselves and pin the KB's embedding model to Gemini per-KB.
      AI_PROVIDER: gemini
      GEMINI_API_KEY: test-dummy-key-do-not-call
      OPENAI_API_KEY: test-dummy-key-do-not-call
      KAIROS_DEMO_MODE: "true"
      BETTER_AUTH_SECRET: "ci-test-secret-for-portal-tests"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      # The integration suites t.skip() when their preconditions are missing,
      # which keeps a developer without Postgres productive but makes a green
      # CI run meaningless if the test database silently went away. This guard
      # turns that false-green into a red build.
      - name: Verify the integration test database is usable
        run: node --import tsx scripts/verify-test-database.ts

      - name: Run the Portal test suite
        run: node --import tsx --test src/__tests__/*.test.ts
