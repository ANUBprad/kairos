name: Portal CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    paths:
      - "apps/portal/**"

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          BETTER_AUTH_SECRET: "ci-placeholder-secret-for-build-only"

  portal-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kairos_test
      KAIROS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kairos_test
      AI_PROVIDER: openai
      OPENAI_API_KEY: test-dummy-key-do-not-call
      KAIROS_DEMO_MODE: "true"
      BETTER_AUTH_SECRET: "ci-test-secret-for-portal-tests"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run the Portal test suite
        run: node --import tsx --test src/__tests__/*.test.ts
