name: CI Regression Tracking

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tracking:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kairos_test

    defaults:
      run:
        working-directory: apps/portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Track a versioned regression comparison headlessly
        run: node --import tsx scripts/verify-regression-tracking.ts

      - name: Upload machine-readable result artifact
        uses: actions/upload-artifact@v4
        with:
          name: regression-tracking-result
          path: apps/portal/regression-tracking-result.json
          if-no-files-found: error