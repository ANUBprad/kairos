name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Dependency security gate. There are currently NO accepted critical/high
  # advisories. If one must be temporarily accepted, record the exact rationale,
  # exposure analysis, compensating controls and owner approval in
  # DEPENDENCY_SECURITY_REMEDIATION.md, then narrow this gate with an explicit,
  # time-bounded exception. Never disable the audit globally.
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Server critical/high advisory gate
        working-directory: server
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Client critical/high advisory gate
        working-directory: client
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Lockfiles are reproducible
        run: git diff --exit-code -- server/package-lock.json client/package-lock.json

  # Staging deployment safety: the staging blueprint must never be able to
  # provision the production service, and no secret may be committed inline.
  staging-blueprint-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Native TypeScript type stripping is used by the redirect guard.
          node-version: "24"
      - name: Staging-only blueprint guard
        run: node scripts/check-staging-blueprint.mjs render.staging.yaml
      - name: Legacy blueprint staging identity guard
        run: node scripts/check-staging-blueprint.mjs render.yaml --legacy
      - name: Auth redirect guard
        run: node scripts/check-safe-redirect.mjs
      - name: OAuth error message guard
        run: node scripts/check-auth-errors.mjs
      - name: Integration callback error guard
        run: node scripts/check-integration-errors.mjs
      - name: Workspace icon guard
        run: node scripts/check-workspace-icons.mjs
      - name: Add Knowledge dialog guard
        run: node scripts/check-add-source-dialog.mjs
      - name: Source sidebar guard
        run: node scripts/check-source-sidebar.mjs

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kairos
      CLIENT_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci_better_auth_secret_32_chars_min
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8081
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      # Optional locally: npm run lint --prefix client (existing debt — see CONTRIBUTING.md)

  e2e:
    runs-on: ubuntu-latest
    needs: [server, client]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kairos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kairos
      CLIENT_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci_better_auth_secret_32_chars_min
      BETTER_AUTH_URL: http://localhost:8081
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8081
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm run prisma:generate
        working-directory: server
      - run: npm run prisma:migrate
        working-directory: server
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          CI: true
